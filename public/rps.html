<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rock Paper Scissors</title>
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app-container">
    <main class="game-card">
        <header class="game-header">
            <h1>Rock, Paper, Scissors</h1>
            <p>A minimalist strategy simulator.</p>
        </header>

        <div class="container">
            <button class="btn" onclick="playGame('Rock')">
                <span class="btn-icon">✊</span>
                <span class="btn-text">Rock</span>
            </button>
            <button class="btn" onclick="playGame('Scissors')">
                <span class="btn-icon">✌️</span>
                <span class="btn-text">Scissors</span>
            </button>
            <button class="btn" onclick="playGame('Paper')">
                <span class="btn-icon">✋</span>
                <span class="btn-text">Paper</span>
            </button>
        </div>

        <div class="results-wrapper">
            <div id="gameResult" class="output-panel">
                <p class="initial-msg">Select a move to begin the match.</p>
            </div>

            <div class="score-panel">
                <span class="panel-label">Current Standings</span>
                <div id="gameScore">
                    <p>Win: 0, Loss: 0, Tie: 0.</p>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="./js/rps.js"></script>
</body>
</html>
