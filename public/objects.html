<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Objects - JavaScript</title>
</head>
<style>body {text-align: center; font-family: 'Inter', sans-serif}</style>
<body>
<h1>Objects - JavaScript</h1>
<script>
    const product = {
        name: 'T-Shirt',
        price: 15
    };
    console.log(product);

    product.price = product.price * product.price;
    product.name = 'Cotton T-Shirt';
    product.availability = true;
    product.description = 'The best T-Shirt on the market';

    console.log(product);

    delete product.description;

    console.log(product);
</script>
</body>
</html>
