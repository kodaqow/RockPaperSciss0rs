<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Objects - JavaScript</title>
</head>
<style>body {text-align: center; font-family: 'Inter', sans-serif}</style>
<body>
<h1>Objects - JavaScript</h1>
<script>
    const product = {
        name: 'T-Shirt',
        price: 15,
        'delivery-time': '7 days',
        rating: {
            stars: 5,
            count: 87
        },
        fun: function function1 () {
            console.log('function inside object');
        }
    };
    console.log(product);

    product.price = product.price * product.price;
    product.name = 'Cotton T-Shirt';
    product.availability = true;
    product.description = 'The best T-Shirt on the market';

    console.log(product);

    delete product.description;

    console.log(product);

    console.log(product['name']);

    product['delivery-time'] = `7 days`
    console.log(product['delivery-time']);

    console.log(product.rating.stars);
    console.log(product.rating.count);

    product.fun();

    console.log(product);

    // Method is function saved inside an object
    // For instance, Math.random - Math is object
    // provided by JavaScript, whereas random is
    // a function that we call

    const jsonString = JSON.stringify(product); // Converts a JS object into a JSON string

    console.log(JSON.stringify(product));

    // JSON serves the same purpose as JS objects
    // However, they have fewer features (JSON does
    // not support functions), but are universal and
    // could be used in many different programming
    // languages, while JS objects are understood
    // solely by JavaScript

    console.log(JSON.parse(jsonString)); // Converts a JSON string into a JS object
</script>
</body>
</html>
